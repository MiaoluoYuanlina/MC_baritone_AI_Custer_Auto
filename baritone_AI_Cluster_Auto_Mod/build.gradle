plugins {
    // The remap plugin supports obfuscated Minecraft releases such as 1.19.4.
    // Loom 1.14+ is required by the Gradle 9 wrapper shipped in this workspace.
    id 'net.fabricmc.fabric-loom' version '1.17.9'
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
repositories { mavenCentral(); maven { url = 'https://maven.fabricmc.net/' } }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
